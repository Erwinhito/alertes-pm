# Le robot : toutes les 30 minutes, il scanne les offres, envoie les alertes
# et publie l'app à jour sur GitHub Pages.
name: Scan des offres

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Scanner et notifier
        run: node scraper/run.js
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Sauvegarder les offres
        run: |
          git config user.name "alertes-pm"
          git config user.email "alertes-pm@users.noreply.github.com"
          git add data web/data
          git diff --cached --quiet && exit 0
          git commit -m "Mise à jour des offres"
          # GitHub a parfois de courtes pannes : on réessaie avant d'abandonner.
          for attempt in 1 2 3 4; do
            git push && exit 0
            sleep $((attempt * 15))
            git pull --rebase origin main || true
          done
          exit 1
      # L'app est publiée même si la sauvegarde a échoué.
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: web
      - uses: actions/deploy-pages@v4
        if: ${{ !cancelled() }}
